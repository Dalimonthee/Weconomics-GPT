{% extends 'chat/base.html' %}

{% block title %}Page Not Found - Weconomics AI Chat{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-8 mx-auto">
        <div class="card shadow text-center py-5">
            <div class="card-body">
                <div class="mb-4">
                    <i class="fas fa-map-signs fa-4x text-muted mb-4"></i>
                    <h1 class="display-1 fw-bold text-muted">404</h1>
                    <h2 class="mb-4">Page Not Found</h2>
                    <p class="lead mb-4">We couldn't find the page you were looking for.</p>
                </div>
                <p class="mb-5">
                    The page might have been moved, deleted, or might never have existed.
                </p>
                <div>
                    <a href="{% url 'conversation_list' %}" class="btn btn-primary">
                        <i class="fas fa-home me-2"></i> Back to Home
                    </a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary ms-2">
                        <i class="fas fa-arrow-left me-2"></i> Go Back
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
